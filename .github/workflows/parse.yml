name: Validate original upper-handbook exercises
on:
  push:
    paths: ['tools/parse.py', 'tools/reviewed-exercises.json', '.github/workflows/parse.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: parse-exercises
  cancel-in-progress: false
jobs:
  parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/parse.py
      - name: Preserve original exercise audit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then git commit -m 'Audit original handbook self-tests and source passages'; git fetch origin main; git merge --no-edit origin/main; git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handbook-exercise-audit
          path: data/exercise-report.json
